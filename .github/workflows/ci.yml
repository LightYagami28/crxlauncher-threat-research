name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: "pip install --require-hashes --only-binary :all: -r requirements.txt"
      - name: Lint YAML (Sigma e workflow)
        run: yamllint -c .yamllint rules .github
      - name: Validazione artefatti (IOC, STIX, Sigma, YARA)
        run: python scripts/check_artifacts.py
      - name: Test
        run: python -m unittest discover -s tests -v

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: "pip install --require-hashes --only-binary :all: -r requirements.txt"
      - name: Test con copertura
        run: |
          python -m pip install --quiet --only-binary :all: coverage==7.17.2
          python -m coverage run --source=scripts -m unittest discover -s tests
          python -m coverage xml -o coverage.xml
      # Il segreto SONAR_TOKEN manca nelle PR da fork e da Dependabot: l'analisi si salta.
      - name: Scansione SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65  # v8.4.1
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
      # Senza CODACY_PROJECT_TOKEN (PR da fork, Dependabot o segreto non ancora
      # configurato) l'invio della copertura si salta senza far fallire il job.
      - name: Copertura su Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699  # v1.3.0
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml
