name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: "pip install --require-hashes --only-binary :all: -r requirements.txt"
      - name: Install dev tooling
        run: >-
          python -m pip install --only-binary :all:
          bandit==1.9.4 coverage==7.17.2 mypy==1.18.2 pip-audit==2.9.0
          pytest==9.2.0 pytest-cov==7.0.0 ruff==0.17.6
          types-PyYAML==6.0.12.20261113
      - name: Lint (ruff)
        run: ruff check .
      - name: Check formatting (ruff format)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy
      - name: Lint YAML (Sigma e workflow)
        run: yamllint -c .yamllint rules .github
      - name: Validazione artefatti (IOC, STIX, Sigma, YARA)
        run: python scripts/check_artifacts.py
      - name: Test (pytest + coverage)
        run: python -m pytest tests --cov=scripts --cov-report=term-missing
      - name: Security scan (bandit)
        run: bandit -r scripts tests
      - name: Security scan (pip-audit)
        run: pip-audit -r requirements.txt

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: "pip install --require-hashes --only-binary :all: -r requirements.txt"
      - name: Install dev tooling
        run: >-
          python -m pip install --only-binary :all:
          coverage==7.17.2 pytest==9.2.0 pytest-cov==7.0.0
      - name: Test con copertura
        run: |
          python -m coverage run --source=scripts -m pytest tests
          python -m coverage xml -o coverage.xml
      - name: Verifica token SonarCloud
        run: test -n "$SONAR_TOKEN"
      - name: Scansione SonarCloud
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4  # v8.5.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
      - name: Copertura su Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699  # v1.3.0
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml
